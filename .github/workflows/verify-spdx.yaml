name: Validate SPDX Conformance

on:
  pull_request:
    branches:
      - 'main'

permissions: {}

jobs:
  check-spdx:
    name: Check SPDX SBOMs
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract version of Go to use
        run: echo "GOVERSION=$(awk -F'[:@]' '/FROM golang/{print $2; exit}' Dockerfile.dev)" >> $GITHUB_ENV

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '${{ env.GOVERSION }}'
          check-latest: true
          cache: false

      - name: Generate example SBOMs
        run: |
          # Everything is written outside the checkout to keep it out of
          # the directory SBOMs
          out="${RUNNER_TEMP}/sboms"
          mkdir -p "${out}"
          go build -o "${RUNNER_TEMP}/bom" ./cmd/bom
          "${RUNNER_TEMP}/bom" generate --format=json -d . -o "${out}/example-directory.spdx.json"
          "${RUNNER_TEMP}/bom" generate --format=tag-value -d . -o "${out}/example-directory.spdx"
          "${RUNNER_TEMP}/bom" generate --format=json -i registry.k8s.io/pause -o "${out}/example-image-pause.spdx.json"
          "${RUNNER_TEMP}/bom" generate --format=json -f "${RUNNER_TEMP}/bom" -o "${out}/example-file.spdx.json"

      - name: Generate example SPDX 3 SBOMs
        run: |
          out="${RUNNER_TEMP}/sboms"
          "${RUNNER_TEMP}/bom" generate --format=spdx3-json -d . -o "${out}/example-directory.spdx3.json"
          "${RUNNER_TEMP}/bom" generate --format=spdx3-json -i registry.k8s.io/pause -o "${out}/example-image-pause.spdx3.json"
          "${RUNNER_TEMP}/bom" generate --format=spdx3-json -f "${RUNNER_TEMP}/bom" -o "${out}/example-file.spdx3.json"

      - uses: chainguard-dev/actions/setup-spdx@e94104128fff55b3c5e1831a8bbbf198603156f9 # v1.7.1
        with:
          spdx-tools-version: 2.0.7

      - uses: chainguard-dev/actions/setup-spdx@e94104128fff55b3c5e1831a8bbbf198603156f9 # v1.7.1
        with:
          download: false
          spdx-tools-version: 2.0.7
          sbom-path: ${{ runner.temp }}/sboms/example-image-pause.spdx.json
          sbom-format: JSON

      - uses: chainguard-dev/actions/setup-spdx@e94104128fff55b3c5e1831a8bbbf198603156f9 # v1.7.1
        with:
          download: false
          spdx-tools-version: 2.0.7
          sbom-path: ${{ runner.temp }}/sboms/example-directory.spdx.json
          sbom-format: JSON

      - uses: chainguard-dev/actions/setup-spdx@e94104128fff55b3c5e1831a8bbbf198603156f9 # v1.7.1
        with:
          download: false
          spdx-tools-version: 2.0.7
          sbom-path: ${{ runner.temp }}/sboms/example-directory.spdx
          sbom-format: TAG

      - uses: chainguard-dev/actions/setup-spdx@e94104128fff55b3c5e1831a8bbbf198603156f9 # v1.7.1
        with:
          download: false
          spdx-tools-version: 2.0.7
          sbom-path: ${{ runner.temp }}/sboms/example-file.spdx.json
          sbom-format: JSON

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ always() }}
        with:
          name: Example SBOMs
          path: |
            ${{ runner.temp }}/sboms/example-image-pause.spdx.json
            ${{ runner.temp }}/sboms/example-directory.spdx.json
            ${{ runner.temp }}/sboms/example-directory.spdx
            ${{ runner.temp }}/sboms/example-file.spdx.json

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Validate example SPDX 3 SBOMs
        run: |
          # Regenerate the pinned requirements with:
          # pip-compile --generate-hashes --strip-extras spdx3-validate.in
          pip install --require-hashes -r .github/workflows/requirements/spdx3-validate.txt
          spdx3-validate -s 3.0.1 --json "${RUNNER_TEMP}/sboms/example-image-pause.spdx3.json"
          spdx3-validate -s 3.0.1 --json "${RUNNER_TEMP}/sboms/example-directory.spdx3.json"
          spdx3-validate -s 3.0.1 --json "${RUNNER_TEMP}/sboms/example-file.spdx3.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ always() }}
        with:
          name: Example SPDX 3 SBOMs
          path: |
            ${{ runner.temp }}/sboms/example-image-pause.spdx3.json
            ${{ runner.temp }}/sboms/example-directory.spdx3.json
            ${{ runner.temp }}/sboms/example-file.spdx3.json
